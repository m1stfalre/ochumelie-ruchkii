name: CI/CD Pipeline

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: bcmath, ctype, fileinfo, json, mbstring, pdo, tokenizer, xml, sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy CI environment file
        run: |
          cp .env.ci .env
          php artisan key:generate --force

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Static Analysis (Larastan)
        run: vendor/bin/phpstan analyse --level=5 --error-format=github

      - name: Linting (Laravel Pint)
        run: vendor/bin/pint --test --preset=psr12

  simulate-deploy:
    runs-on: ubuntu-latest
    needs: test-and-analyze
    if: success() && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "ENV=dev" >> $GITHUB_OUTPUT
            echo "ENV_NAME=Development" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "qa" ]]; then
            echo "ENV=uat" >> $GITHUB_OUTPUT
            echo "ENV_NAME=UAT" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV=prod" >> $GITHUB_OUTPUT
            echo "ENV_NAME=Production" >> $GITHUB_OUTPUT
          fi

      - name: Copy environment file
        run: |
          if [ -f ".env.${{ steps.env.outputs.ENV }}" ]; then
            cp .env.${{ steps.env.outputs.ENV }} .env
            echo "Deploying to ${{ steps.env.outputs.ENV_NAME }}"
          else
            cp .env.example .env
            echo "Deploying to ${{ steps.env.outputs.ENV_NAME }} with default config"
          fi

      - name: Simulate deployment
        run: |
          php artisan config:cache
          php artisan route:cache
          echo "✅ Deployment simulation completed for ${{ steps.env.outputs.ENV_NAME }}"
